# pip config for the PROD context.
# Installs/pulls resolve through the Nexus prod group (your packages + cached PyPI).
# No credentials here — auth comes from the ~/.netrc that nexus-context writes.
#
# ${NEXUS_HOST} / ${NEXUS_PORT} are placeholders, NOT env vars: pip parses config
# with RawConfigParser and performs no interpolation, so it would read them as
# literal text. The nexus-context action substitutes them from secrets while
# rendering this file into $HOME.
[global]
index-url = http://${NEXUS_HOST}:${NEXUS_PORT}/repository/pypi-prod-group/simple
trusted-host = ${NEXUS_HOST}
