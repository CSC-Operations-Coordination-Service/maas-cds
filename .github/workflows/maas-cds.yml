name: maas-cds CI/CD

# Thin caller for the maas-cds package. Wires the reusable building blocks
# from the workflow-catalog repo:
#   python-ci.yml    — test (pytest + SonarQube) -> build (wheel/sdist) -> publish to Nexus
#   sbom.yml         — package CycloneDX SBOM -> Dependency-Track
#   docker-build.yml — image build/push to the Nexus Docker registry (+ image SBOM)
#
# The package lives at the repo root, so project-dir is ".".
#
# Triggers:
#   push to develop   -> ci (test/build/publish to Nexus dev) + package SBOM (dev)
#                        + dev image built from the freshly built wheel
#   push tag x.y.z    -> ci (test/build/publish to Nexus prod) + package SBOM (prod)
#                        + release image installed from Nexus prod + image SBOM
#   workflow_dispatch -> manual run
#
# Runs on the containerized runners (runs-on below), which reach OpenBao.
#
# CI values come from OpenBao, not from the GitHub organisation secrets (since
# 2026-10-22): each job logs in with its GitHub OIDC token as ci-maas-cds
# (ci-maas-cds-release on a tag build) and reads only the tools it lists in
# openbao-tools, from devsecops/ci/<dev|prod>/<tool>. Values, roles and policies:
# the platform repository's OpenBao configuration.

on:
  push:
    branches:
      - "develop"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+" # release tags (x.y.z)
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test, build the wheel/sdist, publish to Nexus. Exposes `version`.
  ci:
    permissions:
      contents: read
      id-token: write # the OIDC token the jobs log in to OpenBao with
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/python-ci.yml@develop
    with:
      runs-on: containerized # the runners on the ocs_openbao network
      secrets-source: openbao
      openbao-role: ci-maas-cds
      openbao-tools: nexus sonarqube
      project-dir: .
      python-version: "3.11"
    # No secrets: inherit: in openbao mode the catalog reads every value from OpenBao.

  # Package SBOM -> Dependency-Track project "maas-cds".
  # Consumes the `dist` artifact built by ci. Release tags only, like the
  # image SBOM of docker-registry: on develop every push would add a dev
  # version to Dependency-Track, and nothing deployed runs a dev build.
  sbom:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write # the OIDC token the jobs log in to OpenBao with
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/sbom.yml@develop
    with:
      runs-on: containerized # the runners on the ocs_openbao network
      secrets-source: openbao
      openbao-role: ci-maas-cds
      openbao-tools: nexus dependency-track
      project-dir: .
      project-name: maas-cds
      project-version: ${{ needs.ci.outputs.version }}
      python-version: "3.11"
      context: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
    # No secrets: inherit: in openbao mode the catalog reads every value from OpenBao.

  # develop / manual: build the image from the wheel ci just produced (Mode 1).
  # mount-pip-index is on because installing that wheel still pulls maas-model,
  # maas-engine and maas-collector from the Nexus dev index.
  docker-local:
    needs: ci
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
      id-token: write # the OIDC token the jobs log in to OpenBao with
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/docker-build.yml@develop
    with:
      runs-on: containerized # the runners on the ocs_openbao network
      secrets-source: openbao
      openbao-role: ci-maas-cds
      openbao-tools: nexus
      image-name: maas-cds
      context: .
      dockerfile: Dockerfile.local
      artifact-name: dist
      artifact-path: dist/
      mount-pip-index: true
      environment: dev
      # The Nexus Docker connector is served over plain HTTP. BuildKit runs in
      # its own container (docker-container driver) and inherits none of the
      # runner daemon's insecure-registries, so `docker login` succeeds while
      # the push fails with "server gave HTTP response to HTTPS client" unless
      # it is told explicitly. Only the Nexus host is marked plain HTTP.
      insecure-registry: true
    # No secrets: inherit: in openbao mode the catalog reads every value from OpenBao.

  # Release only: install maas-cds from the Nexus prod index (Mode 2), push the
  # semver + latest tags, and publish the image SBOM to Dependency-Track.
  # push-to-ghcr / push-to-dockerhub / sign-image are available too — turn them
  # on once the matching secrets (DOCKERHUB_*, COSIGN_*) exist on this repo.
  docker-registry:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write # the OIDC token the jobs log in to OpenBao with
    uses: CSC-Operations-Coordination-Service/workflow-catalog/.github/workflows/docker-build.yml@develop
    with:
      runs-on: containerized # the runners on the ocs_openbao network
      secrets-source: openbao
      openbao-role: ci-maas-cds
      openbao-tools: nexus dependency-track
      image-name: maas-cds
      context: .
      dockerfile: Dockerfile.registry
      build-args: |
        PACKAGE_VERSION=${{ needs.ci.outputs.version }}
      release: true
      mount-pip-index: true
      environment: prod
      # The prod Docker connector is plain HTTP too — see the note in
      # docker-local. Only the host from NEXUS_DOCKER_REGISTRY_PROD is written
      # to BuildKit's registry config.
      insecure-registry: true
      generate-sbom: true
      sbom-project-name: maas-cds-image
      sbom-project-version: ${{ needs.ci.outputs.version }}
    # No secrets: inherit: in openbao mode the catalog reads every value from OpenBao.
